<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off the path · Ben Cressman</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/shared/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/fonts.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/post.css">
  <link rel="stylesheet" href="/wash.css">
  <style>
    /* a page for an address that leads nowhere: Tolkien's line, a wash behind it, and the way home */
    .lost { margin: 18vh 0 0; }
    .lost h1 { position: relative; isolation: isolate; margin: 0; font: 600 clamp(34px, 7vw, 50px)/1.1 'Caveat', 'Caveat Fallback', cursive; transform: rotate(-1.2deg); transform-origin: left; text-wrap: balance; }
    .lost h1 .wash { left: -26px; top: -10px; width: 220px; height: 84px; }
    .lost .by { margin: 10px 0 0; font: 500 19px/1 'Caveat', 'Caveat Fallback', cursive; color: var(--faint); }
    .lost .by::before { content: '— '; }
    .lost p.here { margin: 34px 0 0; color: var(--soft); }
  </style>
</head>
<body class="paper">
  <div class="col">
    <nav class="trail"><a href="/" class="home">← back to the hill</a></nav>
    <main class="lost">
      <h1><span class="wash" aria-hidden="true"></span>Not all those who wander are lost.</h1>
      <p class="by">J.R.R. Tolkien</p>
      <p class="here">This path doesn’t lead anywhere, though. The round green door is <a href="/">back up the hill</a>.</p>
    </main>
  </div>
  <script type="module">
    // the same season and light as the hill, and the same watercolor behind the words
    import { SEASONS, TIMES, when } from '/when.js';
    import { wash, PIGMENTS } from '/paint.js';
    const s = when();
    document.documentElement.dataset.season = SEASONS[s.season];
    document.documentElement.dataset.time = TIMES[s.time];
    const [color, accent] = PIGMENTS[SEASONS[s.season]][3];
    const el = document.querySelector('.lost .wash');
    el.style.backgroundImage = wash({ w: 220, h: 84, color, accent, seed: 404 });
    requestAnimationFrame(() => el.closest('h1').classList.add('bloomed'));
  </script>
</body>
</html>
