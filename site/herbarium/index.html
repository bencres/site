<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · herbarium</title>
  <meta name="description" content="A pressed-plant book of the things Ben Cressman makes, writes and keeps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cedarville+Cursive&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <main class="stage" id="stage">
    <div class="book" id="book">
      <canvas id="bookcanvas" aria-hidden="true"></canvas>
      <p class="label" id="label" aria-hidden="true"></p>
      <article class="page" id="page" aria-live="polite"></article>
    </div>
    <nav class="turns" aria-label="Turn the pages">
      <button type="button" id="prev" class="turn prev"><span aria-hidden="true">☜</span> back a leaf</button>
      <span class="where" id="where"></span>
      <button type="button" id="next" class="turn next">turn the leaf <span aria-hidden="true">☞</span></button>
    </nav>
  </main>
  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
