<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · Shire</title>
  <meta name="description" content="A personal site: a round green door in a grassy hill, in ink and watercolor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <div class="col">
    <header class="porch" id="top">
      <a class="name" href="#top"><span class="wash" aria-hidden="true"></span><span id="name"></span></a>
      <nav class="hall" aria-label="Sections">
        <a href="#now">Now</a>
        <a href="#work">Work</a>
        <a href="#projects">Projects</a>
        <a href="#writing">Writing</a>
        <a href="#elsewhere">Elsewhere</a>
      </nav>
    </header>

    <figure class="hill">
      <canvas id="hill" aria-hidden="true"></canvas>
      <figcaption class="sign" id="sign"></figcaption>
    </figure>

    <main>
      <section class="intro" id="intro"></section>
      <div id="rooms"></div>
    </main>

    <footer class="leaving">
      <figure class="gate">
        <canvas id="gate" aria-hidden="true"></canvas>
        <div class="board">
          <p>Callers welcome on any business</p>
          <a id="post" href="#"></a>
        </div>
      </figure>
      <p class="colophon"><span id="painted"></span> <a href="#top">Back up the path&nbsp;↑</a></p>
    </footer>
  </div>

  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
