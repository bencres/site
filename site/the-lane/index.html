<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · The lane</title>
  <meta name="description" content="A personal site as a walk down a country lane: painted signs, a village of round doors, and a gate at the end.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <!-- shared paint for the lane strips: wet-edge wobble, and lamplight -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lane-wc" x="-5%" y="-10%" width="110%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="4.5"/>
      </filter>
      <radialGradient id="lane-glow">
        <stop offset="0" stop-color="#F5C451" stop-opacity=".75"/>
        <stop offset=".35" stop-color="#F5C451" stop-opacity=".4"/>
        <stop offset="1" stop-color="#F5C451" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <div class="col">
    <header class="top" id="top">
      <a class="name" href="#top"><span class="wash" aria-hidden="true"></span><span id="name"></span></a>
      <p class="tagline" id="tagline"></p>
    </header>

    <figure class="hill">
      <canvas id="lane" aria-hidden="true"></canvas>
      <nav class="fingerpost" id="fingerpost" aria-label="Sections"></nav>
    </figure>
    <p class="greeting" id="greeting"></p>

    <main>
      <section class="intro" id="intro"></section>
      <div id="walk"></div>
    </main>

    <footer class="end">
      <figure class="gate">
        <canvas id="gate" aria-hidden="true"></canvas>
        <div class="sign">
          <p>Callers welcome on any business</p>
          <a id="post" href="#"></a>
        </div>
        <p class="chalk" id="chalk" hidden></p>
      </figure>
      <p class="colophon">
        <span id="painted"></span>
        <a class="arm back" id="back" href="#top">back the way you came&nbsp;↑</a>
      </p>
    </footer>
  </div>

  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
