<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · rings</title>
  <meta name="description" content="Ben Cressman, in cross-section.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <main class="plate">
    <header class="plate-head">
      <span>Plate VIII</span>
      <span class="rule" aria-hidden="true"></span>
      <span><i>Transverse section</i></span>
    </header>

    <div class="plate-body">
      <figure class="specimen" id="specimen">
        <canvas id="slice" aria-hidden="true"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
      </figure>

      <aside class="legend">
        <h1 id="name"></h1>
        <p class="binomial"><i>Arbor personalis</i>, cut through — every year so far.</p>

        <h2 class="key-title">Key</h2>
        <ol class="key" id="key"></ol>

        <article class="card" id="card" aria-live="polite"></article>
      </aside>
    </div>

    <footer class="plate-foot">
      <span>Drawn from life, in ink &amp; watercolor.</span>
      <span>Count inward to go back in time.</span>
    </footer>
  </main>
  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
