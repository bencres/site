<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · The road so far</title>
  <meta name="description" content="What Ben Cressman has been up to, drawn as a pen-and-ink map: each experience is a place, and a dashed red road runs between them in order.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Macondo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <header class="head">
    <p class="kicker"><a href="#" id="home"></a></p>
    <h1>What I&rsquo;ve been up to</h1>
    <p class="intro" id="intro"></p>
  </header>

  <figure class="atlas">
    <div class="map-scroll" id="scroller">
      <div class="map" id="map">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <svg class="overlay" id="overlay" aria-hidden="true"></svg>
        <aside class="card" id="card" hidden>
          <p class="card-kind" id="card-kind"></p>
          <h3 class="card-title" id="card-title"></h3>
          <p class="card-role" id="card-role"></p>
          <p class="card-when" id="card-when"></p>
          <p class="card-note" id="card-note"></p>
          <a class="card-link" id="card-link" href="#"></a>
        </aside>
      </div>
    </div>
    <figcaption><span class="wide">Point at a place on the map, or pick one from the list, to read about it.</span><span class="narrow">Swipe the map sideways, and tap a place to read about it.</span></figcaption>
  </figure>

  <main class="road">
    <h2 id="road-head">The road so far</h2>
    <ol class="stops" id="stops" aria-labelledby="road-head"></ol>
  </main>

  <footer class="foot">
    <p>The road goes on. Write to me at <a id="mail" href="#"></a>.</p>
    <ul class="elsewhere" id="elsewhere"></ul>
  </footer>

  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
