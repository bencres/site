<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Cressman · Sketchbook II</title>
  <meta name="description" content="A personal site, inked and watercolored.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper">
  <div class="page" id="top">
    <header class="masthead">
      <a class="name" href="#top"><span class="name-wash"></span><span id="name"></span></a>
      <nav aria-label="Sections">
        <a href="#now">Now</a>
        <a href="#work">Work</a>
        <a href="#projects">Projects</a>
        <a href="#writing">Writing</a>
        <a href="#elsewhere">Elsewhere</a>
      </nav>
    </header>

    <figure class="hero">
      <canvas id="hero" aria-hidden="true"></canvas>
      <figcaption>
        <span class="hint">psst, the bird is friendly</span>
        <time class="dated" id="dated" title="The picture keeps your local time"></time>
      </figcaption>
    </figure>

    <main>
      <section class="intro" id="intro"></section>
      <div id="sections"></div>
    </main>

    <footer>
      <p class="sign">inked &amp; painted, a little crookedly</p>
      <p class="colophon">Ink and watercolor, drawn in code with Rive. The hillside keeps your clock: <span id="weather"></span>.</p>
    </footer>
  </div>

  <script src="../shared/vendor/rive.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="../shared/switcher.js"></script>
</body>
</html>
